name: Tier proof
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tier-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node scripts/prove-tier-drift.mjs
