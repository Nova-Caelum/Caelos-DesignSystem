name: Catalog checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  catalog-checks:
    name: catalog-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # The existing drift checker needs the runner image's TypeScript.
          tsc_path=$(command -v tsc) || { echo 'The runner image must provide TypeScript for tier drift'; exit 1; }
          export NODE_PATH="$(dirname "$(readlink -f "$tsc_path")")/../.."
          npm run check:catalog -- --base "origin/$BASE_REF"
