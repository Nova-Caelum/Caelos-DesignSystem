name: Unit
# The check's own tests. They run the change's code, so they are given nothing privileged.
on:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test
