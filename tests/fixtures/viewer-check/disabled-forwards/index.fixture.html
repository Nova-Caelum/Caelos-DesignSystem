<!doctype html>
<html><body>
  <section data-family="Attack.DisabledForwards" data-states='["disabled"]'>
    <div class="state-cards" style="display:grid">
      <article data-state-card="disabled" data-events-click="0" data-events-key="0">
        <div class="live-component"><button data-entry="Attack.DisabledForwards" onclick="const card=this.closest('[data-state-card]');card.dataset.eventsClick=String(Number(card.dataset.eventsClick)+1)" onkeydown="if(event.key==='Enter'){const card=this.closest('[data-state-card]');card.dataset.eventsKey=String(Number(card.dataset.eventsKey)+1)}">Bad disabled</button></div>
        <output data-event-readout>click 0 · key 0</output>
      </article>
    </div>
  </section>
</body></html>
