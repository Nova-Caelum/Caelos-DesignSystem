<!doctype html>
<html><body>
  <section data-family="Attack.ClickOnly" data-states='["default"]'>
    <div class="state-cards" style="display:grid">
      <article data-state-card="default" data-events-click="0" data-events-key="0">
        <div class="live-component"><button data-entry="Attack.ClickOnly" onclick="const card=this.closest('[data-state-card]');card.dataset.eventsClick=String(Number(card.dataset.eventsClick)+1)">Click only</button></div>
        <output data-event-readout>click 0 · key 0</output>
      </article>
    </div>
  </section>
</body></html>
